name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Frontend Dependencies
        run: npm --prefix frontend install

      - name: Run Backend Unit Tests
        run: go test -v ./pkg/...

      - name: Build Application with Wails
        run: wails build -platform windows/amd64

      - name: Prepare Release Artifact
        shell: pwsh
        run: |
          $wailsConfig = Get-Content wails.json | ConvertFrom-Json
          $version = $wailsConfig.info.productVersion
          if (-not $version) { $version = "0.1.0" }
          $assetName = "no-bs-transfer-v$version-build.${{ github.run_number }}.exe"
          Copy-Item "build/bin/no-bs-transfer.exe" $assetName
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "ASSET_NAME=$assetName" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}-build.${{ github.run_number }}
          name: no-bs-transfer v${{ env.APP_VERSION }} (build ${{ github.run_number }})
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ env.ASSET_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
